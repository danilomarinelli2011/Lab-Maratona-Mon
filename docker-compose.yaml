# ------------------------------------------------------------------
# docker-compose.yml
# Stack "All-in-One" do Zabbix para laboratório prático:
#   - mysql-server     -> banco de dados do Zabbix (MySQL 8)
#   - zabbix-server     -> servidor Zabbix (coleta e processa dados)
#   - zabbix-web        -> frontend web (Nginx + PHP)
#   - zabbix-agent      -> agente monitorando o próprio container/host
#
# Todos os serviços sobem juntos com um único comando:
#   docker compose up -d
#
# As credenciais e portas vêm do arquivo ".env" (veja .env.example).
# ------------------------------------------------------------------

networks:
  zabbix-net:
    driver: bridge

volumes:
  mysql-data:
  zbx-server-data:
  zbx-server-export:

services:

  mysql-server:
    image: mysql:8.0
    container_name: zbx-mysql
    restart: unless-stopped
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - zabbix-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  zabbix-server:
    image: zabbix/zabbix-server-mysql:alpine-7.0-latest
    container_name: zbx-server
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: mysql-server
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      ZBX_CACHESIZE: 16M
    ports:
      - "${ZABBIX_SERVER_PORT:-10051}:10051"
    volumes:
      - zbx-server-data:/var/lib/zabbix
      - zbx-server-export:/var/lib/zabbix/export
    networks:
      - zabbix-net
    depends_on:
      mysql-server:
        condition: service_healthy

  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:alpine-7.0-latest
    container_name: zbx-web
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: mysql-server
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${ZABBIX_WEB_PORT:-80}:8080"
    networks:
      - zabbix-net
    depends_on:
      mysql-server:
        condition: service_healthy
      zabbix-server:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  zabbix-agent:
    image: zabbix/zabbix-agent:alpine-7.0-latest
    container_name: zbx-agent
    restart: unless-stopped
    environment:
      ZBX_HOSTNAME: "lab-host"
      ZBX_SERVER_HOST: zabbix-server
    networks:
      - zabbix-net
    depends_on:
      - zabbix-server
